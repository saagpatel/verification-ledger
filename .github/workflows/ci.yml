name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest

  # Model-check the fast TLC configurations: every counterexample control (each
  # must still find its violation), the fast-path witness, and Check_MetaErased.
  # The long passing configurations run in tla-full.yml.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TLA2TOOLS: /tmp/tla2tools.jar
      TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          curl -fsSL -o "$TLA2TOOLS" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $TLA2TOOLS" | sha256sum -c -
      - name: Model check
        run: >-
          specs/tla/run.sh
          Control_GateSkipsCheck Control_NoClamp Control_PromotionIgnoresChannel
          Control_PruneIgnoresDurable Control_HealthIgnoresDigest
          Control_HealthIgnoresChainMeta Control_ConsistentChainRewrite
          Control_WriteRecreatesMeta Witness_FastPath Check_MetaErased
      - name: Keep TLC logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-logs
          path: specs/tla/out/
